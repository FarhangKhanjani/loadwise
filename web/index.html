<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LoadWise</title>
  <meta name="description" content="Training load, recovery and calories, from your own LoadWise server.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LoadWise">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="app.css">
  <script src="app.js" defer></script>
</head>
<body class="unpaired">
  <header class="appbar">
    <h1 id="title">LoadWise</h1>
    <p id="subtitle"></p>
  </header>

  <main id="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <nav class="tabbar" aria-label="Sections">
    <a href="#today" data-tab="today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      <span>Today</span>
    </a>
    <a href="#food" data-tab="food">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2v20M4 2v6a3 3 0 0 0 6 0V2M18 22V2c-2.5 1.5-4 4.5-4 9h4"/></svg>
      <span>Food</span>
    </a>
    <a href="#training" data-tab="training">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M3 9v6M17.5 6.5v11M21 9v6M6.5 12h11"/></svg>
      <span>Training</span>
    </a>
    <a href="#history" data-tab="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span>History</span>
    </a>
  </nav>
</body>
</html>
